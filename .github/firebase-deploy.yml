name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main # Adjust this to your main branch name (e.g., master, production)

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest # Or your preferred runner environment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify your Node.js version if your project uses it

      # If you have a build step (e.g., for a JS framework), uncomment and modify this:
      # - name: Install dependencies
      #   run: npm install
      # - name: Build project
      #   run: npm run build # Adjust if your build command is different

      - name: FIREBASE_SERVICE_ACCOUNT_ARAMBH_TECHNOLOGIES
        uses: FirebaseExtended/action-hosting-deploy@v0 # The official Firebase Hosting GitHub Action
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}' # Provided by GitHub
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARAMBH_TECHNOLOGIES }}' # Your secret name
          projectId: 'arambh-technologies' # Your Firebase Project ID
          # Optionally, if your deployable files are NOT in the root, specify the `public` directory:
          # public: './public' # For example, if your deployable files are in a 'public' subfolder
